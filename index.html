<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Precificação</title>

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      padding: 32px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: 15px;
    }

    .socios-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .socio-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .result-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .result-box strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .results { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Calculadora de Preço de Serviço</h1>
    <div class="subtitle">
      Calcule quanto cobrar considerando imposto, comissão e valores por sócio.
    </div>

    <div class="card">
      <div class="grid">

        <div>
          <label>Número de sócios</label>
          <input id="socios" type="number" value="3" />
        </div>

        <div>
          <label>Imposto (%)</label>
          <input id="imposto" type="number" value="10" />
        </div>

        <div>
          <label>Comissão (%)</label>
          <input id="comissao" type="number" value="20" />
        </div>

      </div>

      <div class="socios-list" id="sociosList"></div>
    </div>

    <div class="card">
      <h3>Resultados</h3>

      <div class="results">
        <div class="result-box">
          Total
          <strong id="totalProjeto"></strong>
        </div>

        <div class="result-box">
          Imposto
          <strong id="valorImposto"></strong>
        </div>

        <div class="result-box">
          Comissão
          <strong id="valorComissao"></strong>
        </div>

        <div class="result-box">
          Líquido
          <strong id="liquidoSocios"></strong>
        </div>
      </div>
    </div>

  </div>

<script>
const nomes = ["EVD", "Lighthouse", "CKT"];

const sociosInput = document.getElementById('socios');
const sociosList = document.getElementById('sociosList');
const impostoInput = document.getElementById('imposto');
const comissaoInput = document.getElementById('comissao');

const outputs = {
  totalProjeto: document.getElementById('totalProjeto'),
  valorImposto: document.getElementById('valorImposto'),
  valorComissao: document.getElementById('valorComissao'),
  liquidoSocios: document.getElementById('liquidoSocios')
};

function format(v){
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
}

function renderSocios(){
  sociosList.innerHTML='';
  const n = sociosInput.value;

  for(let i=0;i<n;i++){
    const row = document.createElement('div');
    row.className='socio-row';

    row.innerHTML=`
      <label>${nomes[i]||'Sócio '+(i+1)}</label>
      <input class="val" value="10000" type="number" />
    `;

    sociosList.appendChild(row);
  }

  document.querySelectorAll('.val').forEach(i=>i.addEventListener('input',calc));
  calc();
}

function calc(){
  const valores = [...document.querySelectorAll('.val')].map(i=>+i.value||0);
  const soma = valores.reduce((a,b)=>a+b,0);

  const imposto = impostoInput.value/100;
  const comissao = comissaoInput.value/100;

  const fator = (1-imposto)*(1-comissao);
  const total = soma/fator;

  const impostoValor = total*imposto;
  const aposImposto = total-impostoValor;
  const comissaoValor = aposImposto*comissao;
  const liquido = aposImposto-comissaoValor;

  outputs.totalProjeto.innerText = format(total);
  outputs.valorImposto.innerText = format(impostoValor);
  outputs.valorComissao.innerText = format(comissaoValor);
  outputs.liquidoSocios.innerText = format(liquido);
}

sociosInput.addEventListener('input', renderSocios);
impostoInput.addEventListener('input', calc);
comissaoInput.addEventListener('input', calc);

renderSocios();
</script>

</body>
</html>
